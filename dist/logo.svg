<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="15" y="15" width="170" height="170" rx="36" fill="url(#vrGrad)" />
  <rect x="20" y="20" width="160" height="160" rx="32" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  
  <!-- Tech Circuit Accents -->
  <circle cx="50" cy="50" r="4" fill="#93c5fd" opacity="0.8" />
  <path d="M50 50 L65 50" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="150" cy="150" r="4" fill="#93c5fd" opacity="0.8" />
  <path d="M135 150 L150 150" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- VR Monogram & Lightning Bolt -->
  <g transform="translate(10, 5)">
    <!-- Electric Bolt in Center -->
    <polygon points="102,42 72,102 96,102 78,154 126,90 102,90 118,42" fill="url(#boltGrad)" filter="url(#glow)"/>
    
    <!-- Lettering V and R styling -->
    <path d="M46 68 L64 120 L78 120 L60 68 Z" fill="#ffffff" />
    <path d="M120 68 L120 120 L134 120 L134 98 L144 98 L154 120 L170 120 L156 94 C164 90 168 82 168 76 C168 68 160 68 148 68 Z M134 78 L146 78 C150 78 154 80 154 84 C154 88 150 90 146 90 L134 90 Z" fill="#ffffff" />
  </g>
</svg>
